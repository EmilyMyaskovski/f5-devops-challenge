# Send nginx logs to the container's stdout/stderr so that
# `docker compose logs proxy` shows them on any base image.
error_log /dev/stderr warn;

# Store the PID in a writable location.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    # Do not expose the Nginx version in HTTP responses.
    server_tokens off;

    # Writable temporary directories for non-root execution.
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    upstream app_backend {
        server backend:8080;
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /nginx-health {
            default_type application/json;
            return 200 '{"proxy": "ok"}';
        }
    }
}
